components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ScholarshipIdParam:
      name: scholarshipId
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Requête invalide ou erreur de validation des champs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Jeton d'authentification manquant ou expiré
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    Forbidden:
      description: Authenticated principal lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: State conflict or confirmed duplicate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: Business input inconsistent with validated domain rules
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Temporary external provider or backend failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    UserRole:
      type: string
      enum: [STUDENT, ORGANIZATION, CURATOR, ADMIN]

    AcademicLevel:
      type: string
      enum:
      - Baccalauréat
      - BTS
      - DUT
      - HND
      - Licence
      - Master
      - Doctorat
      - Formation professionnelle
      - Formation complémentaire

      x-enum-varnames:
      - BACCALAUREAT
      - BTS
      - DUT
      - HND
      - LICENCE
      - MASTER
      - DOCTORAT
      - FORMATION_PROFESSIONNELLE
      - FORMATION_COMPLEMENTAIRE
    StudyDomain:
      type: string
      enum:
      - Informatique & Systèmes
      - Génie Civil & Infrastructures
      - Santé & Sciences Biomédicales
      - Agronomie & Environnement
      - Économie, Gestion & Finance
      - Droit & Sciences Politiques
      - Énergies Renouvelables & Mines
      - Sciences de l’Éducation
      - Tous domaines

      x-enum-varnames:
      - INFORMATIQUE_SYSTEMES
      - GENIE_CIVIL_INFRASTRUCTURES
      - SANTE_SCIENCES_BIOMEDICALES
      - AGRONOMIE_ENVIRONNEMENT
      - ECONOMIE_GESTION_FINANCE
      - DROIT_SCIENCES_POLITIQUES
      - ENERGIES_RENOUVELABLES_MINES
      - SCIENCES_EDUCATION
      - TOUS_DOMAINES
    FundingType:
      type: string
      enum:
      - Bourse complète (Frais + Vie + Transport)
      - Exonération des frais de scolarité
      - Allocation mensuelle de subsistance
      - Cofinancement / Bourse partielle
      - Bourse de recherche & mobilité

      x-enum-varnames:
      - COMPLETE
      - TUITION_WAIVER
      - MONTHLY_STIPEND
      - PARTIAL
      - RESEARCH_MOBILITY
    GradingScale:
      type: string
      enum: [SUR_20, GPA_4, POURCENTAGE_100]

    LanguageLevel:
      type: string
      enum: [A1, A2, B1, B2, C1, C2, Natif]

    CurationStatus:
      type: string
      enum: [VERIFIED, PENDING_REVIEW, REJECTED, ARCHIVED]

    ScholarshipStatus:
      type: string
      enum: [OPEN, CLOSING_SOON, EXPIRED, DRAFT]
      description: LEGACY display availability including DRAFT; preserve original values. New 
        publicationStatus on Scholarship separates editorial lifecycle from deadlines.

    EligibilityGlobalVerdict:
      type: string
      enum: [POTENTIALLY_COMPATIBLE, TO_COMPLETE, TO_VERIFY, INCOMPATIBLE]

    CriterionEvaluationStatus:
      type: string
      enum: [SATISFIED, NOT_SATISFIED, MISSING_INFO, AMBIGUOUS_TO_VERIFY]

    PlanTierId:
      type: string
      enum: [STUDENT_FREE, ORG_DISCOVERY, ORG_PRO, ORG_PREMIUM, ORG_SINGLE_CAMPAIGN]
      description: Preserve legacy values for existing UI; commercial plans only apply to organizations.

    ApplicationStatus:
      type: string
      enum:
      - Candidature reçue
      - En cours d’examen
      - Présélectionnée
      - Retenue
      - Non retenue

    UserAccount:
      type: object
      required: [id, fullName, email, role, active, createdAt, linkedEntityId]
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        active:
          type: boolean
        createdAt:
          type: string
          format: date
        linkedEntityId:
          type: string

    RegisterStudentRequest:
      type: object
      required: [firstName, lastName, email, password, nationality, residenceCountry]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        nationality:
          type: string
        residenceCountry:
          type: string
        highestDiplomaObtained:
          $ref: '#/components/schemas/AcademicLevel'
        currentStudyLevel:
          $ref: '#/components/schemas/AcademicLevel'
        targetStudyLevel:
          $ref: '#/components/schemas/AcademicLevel'
        studyDomain:
          $ref: '#/components/schemas/StudyDomain'

    RegisterOrganizationRequest:
      type: object
      required: [officialName, type, country, contactEmail, contactPersonName, password, 
          registrationNumber]
      properties:
        officialName:
          type: string
        type:
          type: string
          enum: [Université, Ministère, Fondation, Ambassade, Coopération internationale, Entreprise, ONG]
        country:
          type: string
        website:
          type: string
          format: uri
        contactEmail:
          type: string
          format: email
        contactPersonName:
          type: string
        contactPersonRole:
          type: string
        registrationNumber:
          type: string
        password:
          type: string
          format: password
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/UserAccount'

    LanguageSkill:
      type: object
      required: [language, level]
      properties:
        language:
          type: string
          enum: [Français, Anglais, Allemand, Espagnol, Mandarin]
        level:
          $ref: '#/components/schemas/LanguageLevel'
        certification:
          type: string
          nullable: true

    StudentProfile:
      type: object
      required:
      - id
      - userId
      - firstName
      - lastName
      - email
      - isMinor
      - nationality
      - residenceCountry
      - highestDiplomaObtained
      - currentStudyLevel
      - targetStudyLevel
      - studyDomain
      - gradingScale
      - languages
      - preferredDestinationCountries
      - preferredFundingTypes
      - institutionalVisibilityEnabled
      - allowAcademicScoreSharing
      - savedScholarshipIds
      - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        birthYear:
          type: integer
        isMinor:
          type: boolean
        guardianConsentVerified:
          type: boolean
          nullable: true
        nationality:
          type: string
        residenceCountry:
          type: string
        city:
          type: string
        highestDiplomaObtained:
          $ref: '#/components/schemas/AcademicLevel'
        highestDiplomaName:
          type: string
        currentStudyLevel:
          $ref: '#/components/schemas/AcademicLevel'
        targetStudyLevel:
          $ref: '#/components/schemas/AcademicLevel'
        studyDomain:
          $ref: '#/components/schemas/StudyDomain'
        currentInstitution:
          type: string
        academicYear:
          type: string
        averageGrade:
          type: number
          format: float
          nullable: true
        gradingScale:
          $ref: '#/components/schemas/GradingScale'
        normalizedGradeOut20:
          type: number
          format: float
          nullable: true
        languages:
          type: array
          items:
            $ref: '#/components/schemas/LanguageSkill'
        preferredDestinationCountries:
          type: array
          items:
            type: string
        preferredFundingTypes:
          type: array
          items:
            $ref: '#/components/schemas/FundingType'
        institutionalVisibilityEnabled:
          type: boolean
          default: false
        visibilityConsentDate:
          type: string
          format: date
          nullable: true
        allowAcademicScoreSharing:
          type: boolean
          default: false
        savedScholarshipIds:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date

        academicRecords:
          type: array
          items:
            $ref: '#/components/schemas/AcademicRecord'
        profileCompletion:
          $ref: '#/components/schemas/ProfileCompletion'
        visibilityConsentAt:
          type: string
          format: date-time
          nullable: true
        visibilityRevokedAt:
          type: string
          format: date-time
          nullable: true
