x-contract-policy:
  compatibility: 'Additive v1.1 proposal: preserve v1 legacy endpoints, operationIds, schema enums/required
    fields'
  frontendModes:
  - mock
  - real
  requireBackendAuthz: true
  requireHumanReviewForAi: true
  eligibilityEngine: deterministic Java rules only, four original verdict values unchanged
  privacy: opt-in discoverability; opaque candidate public tokens; separate dossier consent
  billing: public professional plans do not create charges or unlock paid features automatically
