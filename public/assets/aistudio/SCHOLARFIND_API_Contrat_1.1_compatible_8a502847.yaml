openapi: 3.0.3
info:
  title: SCHOLARFIND B2B2C REST API
  version: 1.1.0
  description: |
    Contrat d'interface OpenAPI 3.0 complet de la plateforme **SCHOLARFIND** (Système automatisé de recherche, de recommandation explicable, de vérification d'éligibilité aux bourses d'études et de mise en relation B2B2C).

    ### Architecture & Conformité
    - **Backend cible** : Java 21 / Spring Boot 3.x + Spring Security (JWT + RBAC) + PostgreSQL.
    - **Distinction académique stricte** : Le schéma distingue systématiquement les 3 niveaux académiques (`highestDiplomaObtained`, `currentStudyLevel`, `targetStudyLevel`).
    - **Moteur d'éligibilité déterministe & explicable** : Évalue 9 critères obligatoires, normalise les moyennes (`SUR_20`, `GPA_4`, `POURCENTAGE_100` vers `/20`) et retourne l'un des 4 verdicts (`POTENTIALLY_COMPATIBLE`, `TO_COMPLETE`, `TO_VERIFY`, `INCOMPATIBLE`).
    - **Protection des données personnelles (Loi camerounaise n° 2024/017 du 23 décembre 2024)** :
      - Profil étudiant privé par défaut (`institutionalVisibilityEnabled: false`).
      - Anonymisation des profils visibles dans le vivier organisme (`CAND-CM-YYYY-XXXX`).
      - Consentement spécifique horodaté requis avant tout partage de dossier suite à une invitation.


        ### Additive v1.1 frontend handoff (proposed, not deployed)
        - Existing v1.0 endpoints, operationIds and wire-format values remain available.
        - New /admin/scholarships endpoints let admins create and publish records.
        - New AI/ingestion endpoints orchestrate Gemini through the backend only.
        - New paged search is opt-in: legacy GET /scholarships still returns an array.
        - Academic visibility is opt-in; candidate discovery uses opaque public identifiers.
        - An AI extraction is an untrusted draft requiring validation and human review.
        - Contract describes a future API; it is NOT evidence that a backend is running.
  contact:
    name: Équipe Architecture SCHOLARFIND
    email: api@scholarfind.cm

servers:
- url: https://api.scholarfind.cm/api/v1
  description: Target production URL (illustrative, not confirmed deployed)
- url: http://localhost:8080/api/v1
  description: Local Spring Boot development target (not yet deployed)

tags:
- name: Auth
  description: Authentification JWT, inscription étudiant/organisme et session courante
- name: Scholarships
  description: Catalogue public des bourses, recherche multicritère et détails vérifiés
- name: Students
  description: Gestion du profil académique, consentement de visibilité (Loi n° 2024/017), favoris et 
    recommandations
- name: Eligibility
  description: Moteur déterministe d'évaluation et d'explicabilité d'éligibilité critère par critère
- name: Invitations & Applications
  description: Invitations institutionnelles, consentement de partage de dossier et suivi des 
    candidatures
- name: Organizations
  description: Gestion de l'organisme financeur, campagnes de bourses, vivier de candidats anonymisés, 
    équipe d'évaluateurs et abonnements B2B
- name: Curation
  description: Vérification documentaire des bourses, fiabilité des sources officielles et résolution des
    doublons
- name: Admin
  description: Gouvernance de la plateforme, vérification des organismes, gestion des comptes et journal 
    d'audit

- name: AdminScholarships
  description: Manual scholarship drafts, editorial workflow and publication
- name: AI
  description: Gemini-backed extraction and provenance review through backend only
- name: Ingestion
  description: Asynchronous retrieval and import jobs
- name: Dashboard
  description: Read-only aggregated dashboards
- name: AcademicRecords
  description: Student educational history with multiple diplomas
- name: Plans
  description: Public professional plans and organization subscription requests
- name: Campaigns
  description: Organization campaign cycles separate from scholarship programs
security:
- bearerAuth: []

paths:
  # ============================================================================
  # 1. AUTHENTIFICATION & COMPTES (/auth)
  # ============================================================================
  /auth/register/student:
    post:
      tags: [Auth]
      summary: Inscription d'un nouvel étudiant (100 % gratuit, profil privé par défaut)
      operationId: registerStudent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStudentRequest'
      responses:
        '201':
          description: Compte étudiant créé avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Adresse e-mail déjà utilisée

  /auth/register/organization:
    post:
      tags: [Auth]
      summary: Demande d'ouverture de compte pour un organisme financeur (soumis à vérification)
      operationId: registerOrganization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrganizationRequest'
      responses:
        '201':
          description: Compte organisme créé en statut PENDING (en attente de vérification 
            administrative)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authentification par e-mail et mot de passe (retourne un jeton JWT)
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Récupère le compte utilisateur connecté et son entité liée (Étudiant ou Organisme)
      operationId: getCurrentUser
      responses:
        '200':
          description: Profil de session courant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # 2. CATALOGUE PUBLIC DES BOURSES (/scholarships)
  # ============================================================================
      x-required-roles:
      - STUDENT
      - ORGANIZATION
      - CURATOR
      - ADMIN
  /scholarships:
    get:
      tags: [Scholarships]
      summary: Recherche et filtrage multicritère dans le catalogue des bourses
      operationId: searchScholarships
      security: []
      parameters:
      - name: q
        in: query
        description: Mot-clé (titre, organisme, pays, description)
        schema:
          type: string
      - name: targetLevel
        in: query
        description: Niveau d'études financé recherché
        schema:
          $ref: '#/components/schemas/AcademicLevel'
      - name: requiredDiploma
        in: query
        description: Dernier diplôme déjà obtenu par le candidat
        schema:
          $ref: '#/components/schemas/AcademicLevel'
      - name: domain
        in: query
        description: Domaine de formation éligible
        schema:
          $ref: '#/components/schemas/StudyDomain'
      - name: hostCountry
        in: query
        description: Pays d'accueil de la bourse
        schema:
          type: string
      - name: fundingType
        in: query
        description: Type de couverture financière
        schema:
          $ref: '#/components/schemas/FundingType'
      - name: includeExpired
        in: query
        schema:
          type: boolean
          default: false
      - name: onlyVerified
        in: query
        schema:
          type: boolean
          default: false
      - name: sortBy
        in: query
        schema:
          type: string
          enum: [DEADLINE_ASC, MIN_GRADE_ASC, RECENTLY_VERIFIED]
          default: DEADLINE_ASC
      responses:
        '200':
          description: Liste des bourses correspondant aux critères
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scholarship'

  /scholarships/{scholarshipId}:
    get:
      tags: [Scholarships]
      summary: Consulte la fiche détaillée d'une bourse (critères, financement, pièces, traçabilité 
        source)
      operationId: getScholarshipById
      security: []
      parameters:
      - $ref: '#/components/parameters/ScholarshipIdParam'
      responses:
        '200':
          description: Fiche complète du programme de bourse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scholarship'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # 3. ESPACE ÉTUDIANT : PROFIL, CONFIDENTIALITÉ, FAVORIS & RECOMMANDATIONS
  # ============================================================================
  /students/me/profile:
    get:
      tags: [Students]
      summary: "Consulte le profil complet de l'étudiant connecté (3 sections : Identité, Parcours académique,
        Projet d'études)"
      operationId: getMyStudentProfile
      responses:
        '200':
          description: Profil académique et personnel de l'étudiant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'
      x-required-roles:
      - STUDENT
    put:
      tags: [Students]
      summary: Met à jour le profil étudiant et recalcule automatiquement la moyenne normalisée sur 20
      operationId: updateMyStudentProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        '200':
          description: Profil mis à jour avec `normalizedGradeOut20` recalculé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'

      x-required-roles:
      - STUDENT
  /students/me/privacy:
    patch:
      tags: [Students]
      summary: Active ou révoque la visibilité institutionnelle du profil (Loi camerounaise n° 2024/017)
      operationId: updateStudentPrivacyConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyConsentUpdateRequest'
      responses:
        '200':
          description: Paramètres de confidentialité mis à jour et journalisés dans l'audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfile'

      x-required-roles:
      - STUDENT
  /students/me/favorites:
    get:
      tags: [Students]
      summary: Liste les bourses enregistrées dans les favoris de l'étudiant avec leur rapport 
        d'éligibilité
      operationId: getMyFavoriteScholarships
      responses:
        '200':
          description: Liste des bourses favorites triées par échéance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvaluatedScholarshipItem'

  /students/me/favorites/{scholarshipId}:
    post:
      tags: [Students]
      summary: Ajoute une bourse aux favoris de l'étudiant
      operationId: addFavoriteScholarship
      parameters:
      - $ref: '#/components/parameters/ScholarshipIdParam'
      responses:
        '200':
          description: Identifiants des bourses favorites mis à jour
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
    delete:
      tags: [Students]
      summary: Retire une bourse des favoris de l'étudiant
      operationId: removeFavoriteScholarship
      parameters:
      - $ref: '#/components/parameters/ScholarshipIdParam'
      responses:
        '200':
          description: Identifiants des bourses favorites mis à jour
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /students/me/recommendations:
    get:
      tags: [Students]
      summary: Récupère les recommandations personnalisées de bourses basées sur le parcours académique 
        et le domaine
      operationId: getMyRecommendations
      responses:
        '200':
          description: Recommandations structurées en 2 groupes (Forte pertinence vs À 
            compléter/vérifier) avec motifs explicites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'

  # ============================================================================
  # 4. MOTEUR D'ÉLIGIBILITÉ EXPLICABLE (/eligibility)
  # ============================================================================
      x-required-roles:
      - STUDENT
  /eligibility/evaluate/{scholarshipId}:
    get:
      tags: [Eligibility]
      summary: Évalue l'éligibilité de l'étudiant connecté pour une bourse donnée (critère par critère)
      operationId: evaluateEligibilityForCurrentStudent
      parameters:
      - $ref: '#/components/parameters/ScholarshipIdParam'
      responses:
        '200':
          description: Rapport d'éligibilité détaillé sur les 9 critères obligatoires avec mention légale
            de non-garantie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityReport'

      x-required-roles:
      - STUDENT
  /eligibility/simulate:
    post:
      tags: [Eligibility]
      summary: Simule un rapport d'éligibilité à partir d'un profil candidat hypothétique et d'une bourse
      operationId: simulateEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scholarshipId, studentProfile]
              properties:
                scholarshipId:
                  type: string
                studentProfile:
                  $ref: '#/components/schemas/UpdateStudentProfileRequest'
      responses:
        '200':
          description: Rapport d'éligibilité simulé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityReport'

  # ============================================================================
  # 5. INVITATIONS, CANDIDATURES & NOTIFICATIONS
  # ============================================================================
  /students/me/invitations:
    get:
      tags: [Invitations & Applications]
      summary: Liste les invitations reçues par l'étudiant de la part d'organismes financeurs vérifiés
      operationId: getMyStudentInvitations
      responses:
        '200':
          description: Liste des invitations reçues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'

  /students/me/invitations/{invitationId}/respond:
    post:
      tags: [Invitations & Applications]
      summary: Accepte (avec consentement explicite de partage du dossier) ou décline une invitation
      operationId: respondToInvitation
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondInvitationRequest'
      responses:
        '200':
          description: Invitation mise à jour (et candidature créée si acceptée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'

  /students/me/applications:
    get:
      tags: [Invitations & Applications]
      summary: Liste les candidatures soumises par l'étudiant et leur statut d'évaluation
      operationId: getMyApplications
      responses:
        '200':
          description: Liste des dossiers de candidature de l'étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationRecord'
    post:
      tags: [Invitations & Applications]
      summary: Soumet un dossier de candidature à un programme de bourse
      operationId: submitApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitApplicationRequest'
      responses:
        '201':
          description: Dossier de candidature créé et transmis à l'organisme
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRecord'

  /notifications:
    get:
      tags: [Invitations & Applications]
      summary: Récupère les notifications de l'utilisateur connecté
      operationId: getMyNotifications
      responses:
        '200':
          description: Liste des notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppNotification'

  /notifications/{notificationId}/read:
    patch:
      tags: [Invitations & Applications]
      summary: Marque une notification comme lue
      operationId: markNotificationRead
      parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Notification marquée comme lue

  /notifications/read-all:
    post:
      tags: [Invitations & Applications]
      summary: Marque toutes les notifications de l'utilisateur comme lues
      operationId: markAllNotificationsRead
      responses:
        '204':
          description: Toutes les notifications ont été marquées comme lues

  # ============================================================================
  # 6. ESPACE ORGANISME FINANCEUR (/organizations)
  # ============================================================================
  /organizations/me:
    get:
      tags: [Organizations]
      summary: Récupère le profil institutionnel de l'organisme connecté, son plan actif et ses 
        évaluateurs
      operationId: getMyOrganizationProfile
      responses:
        '200':
          description: Profil complet de l'organisme financeur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'
    put:
      tags: [Organizations]
      summary: Met à jour les informations institutionnelles de l'organisme
      operationId: updateMyOrganizationProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationProfileRequest'
      responses:
        '200':
          description: Profil organisme mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationProfile'

  /organizations/me/scholarships:
    get:
      tags: [Organizations]
      summary: Liste les campagnes de bourses créées par l'organisme connecté
      operationId: getOrganizationScholarships
      responses:
        '200':
          description: Liste des campagnes de l'organisme
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scholarship'
    post:
      tags: [Organizations]
      summary: Create an organization scholarship submission, pending curation (never auto-published)
      operationId: createOrganizationScholarship
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertScholarshipRequest'
      responses:
        '201':
          description: Campagne créée et soumise à la curation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scholarship'

      description: New submission becomes draft or pending review; publication requires approval.
      x-required-roles:
      - ORGANIZATION
  /organizations/me/scholarships/{scholarshipId}:
    put:
      tags: [Organizations]
      summary: Modifie les paramètres ou critères d'une campagne de bourse existante
      operationId: updateOrganizationScholarship
      parameters:
      - $ref: '#/components/parameters/ScholarshipIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertScholarshipRequest'
      responses:
        '200':
          description: Campagne mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scholarship'

    get:
      tags:
      - Organizations
      summary: Get own submitted scholarship details
      operationId: getOrganizationScholarship
      x-required-roles:
      - ORGANIZATION
      parameters:
      - &id001
        $ref: '#/components/parameters/ScholarshipIdParam'
      responses:
        '200':
          description: Get own submitted scholarship details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scholarship'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /organizations/me/talent-pool:
    get:
      tags: [Organizations]
      summary: Recherche dans le vivier de candidats anonymisés ayant activé leur visibilité 
        institutionnelle
      operationId: searchAnonymizedTalentPool
      parameters:
      - name: scholarshipId
        in: query
        schema:
          type: string
      - name: targetLevel
        in: query
        schema:
          $ref: '#/components/schemas/AcademicLevel'
      - name: domain
        in: query
        schema:
          $ref: '#/components/schemas/StudyDomain'
      - name: minGradeOut20
        in: query
        schema:
          type: number
          format: float
      responses:
        '200':
          description: Liste des profils étudiants anonymisés éligibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnonymizedCandidateProfile'

      x-required-roles:
      - ORGANIZATION
  /organizations/me/invitations:
    post:
      tags: [Organizations]
      summary: Envoie une invitation à candidater à un profil étudiant ayant activé sa visibilité
      operationId: sendInvitationToStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInvitationRequest'
      responses:
        '201':
          description: Invitation transmise et notification envoyée à l'étudiant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '403':
          description: Action refusée (profil étudiant privé ou organisme non vérifié)

      x-required-roles:
      - ORGANIZATION
    get:
      tags:
      - Organizations
      summary: List invitations sent by own verified organization
      operationId: getOrganizationSentInvitations
      x-required-roles:
      - ORGANIZATION
      responses:
        '200':
          description: List invitations sent by own verified organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /organizations/me/applications:
    get:
      tags: [Organizations]
      summary: Liste les dossiers de candidature reçus pour les campagnes de l'organisme
      operationId: getOrganizationApplications
      parameters:
      - name: scholarshipId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: Liste des candidatures reçues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationRecord'

  /organizations/me/applications/{applicationId}/evaluate:
    patch:
      tags: [Organizations]
      summary: Met à jour le statut, la note d'évaluation (/100) et la décision motivée d'une candidature
      operationId: evaluateApplication
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateApplicationRequest'
      responses:
        '200':
          description: Dossier de candidature mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationRecord'

  /organizations/me/evaluators:
    post:
      tags: [Organizations]
      summary: Ajoute un collaborateur évaluateur à l'équipe de l'organisme
      operationId: addOrganizationEvaluator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddEvaluatorRequest'
      responses:
        '201':
          description: Collaborateur ajouté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorMember'

  /organizations/me/subscription:
    get:
      tags: [Organizations]
      summary: Consulte l'abonnement B2B actif de l'organisme financeur
      operationId: getOrganizationSubscription
      responses:
        '200':
          description: Détails de l'abonnement commercial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialSubscription'
    put:
      tags: [Organizations]
      summary: Change la formule d'abonnement B2B de l'organisme (Découverte, Pro, Premium, Campagne 
        ponctuelle)
      operationId: changeOrganizationPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  $ref: '#/components/schemas/PlanTierId'
      responses:
        '200':
          description: Abonnement mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommercialSubscription'

  # ============================================================================
  # 7. ESPACE CURATEUR (/curation)
  # ============================================================================
      description: Legacy sandbox simulation only. Never unlock paid entitlements solely from this client
        request. New integration should use /organizations/me/subscription/requests.
      deprecated: true
  /curation/scholarships/{scholarshipId}:
    patch:
      tags: [Curation]
